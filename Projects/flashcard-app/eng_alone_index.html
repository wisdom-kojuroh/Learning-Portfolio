<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗記カードアプリ</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div id="flashcard-container" style="border:2px solid #ccc;padding:20px;border-radius:8px;max-width:400px;margin:20px auto;font-family:sans-serif;">
  <div style="margin-bottom:12px;text-align:left;">
    <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;flex-wrap:wrap;">
      <button id="review-mode-btn" style="padding:4px 6px;font-size:11px;cursor:pointer;background:#d9534f;color:white;border:none;border-radius:4px;white-space:nowrap;flex-shrink:0;">今日の復習</button>
      <button id="all-mode-btn" style="padding:4px 6px;font-size:11px;cursor:pointer;background:#0073aa;color:white;border:none;border-radius:4px;white-space:nowrap;flex-shrink:0;">全カード</button>
      <button id="shuffle-mode-btn" style="padding:4px 6px;font-size:11px;cursor:pointer;background:#f0ad4e;color:white;border:none;border-radius:4px;white-space:nowrap;flex-shrink:0;">🔀シャッフル</button>
      <button id="mastered-mode-btn" style="padding:4px 6px;font-size:11px;cursor:pointer;background:#5cb85c;color:white;border:none;border-radius:4px;white-space:nowrap;flex-shrink:0;">習得済み</button>
      <div id="tag-filter-container" style="display:flex;overflow-x:auto;gap:4px;padding-bottom:4px;white-space:nowrap;-webkit-overflow-scrolling:touch;width:100%;margin-top:4px;"></div>
    </div>
  </div>

  <div style="text-align:center;">
    <div id="card-tag" style="font-size:12px;color:#0073aa;font-weight:bold;margin-bottom:8px;background:#eef5fa;display:inline-block;padding:2px 8px;border-radius:10px;">🏷️ タグ</div>
    <div id="card-question" style="font-size:24px;font-weight:bold;margin-bottom:15px;">ここに英語が表示されるよ</div>
    <div id="card-answer" style="font-size:18px;color:#666;margin-bottom:10px;display:none;">ここに日本語訳が出るよ</div>
    <div id="card-note" style="font-size:13px;color:#888;background:#f9f9f9;padding:6px;border-radius:4px;margin-bottom:15px;display:none;text-align:left;"></div>
    
    <div id="edit-form-container" style="display:none;margin-bottom:15px;text-align:left;background:#f9f9f9;padding:10px;border-radius:6px;">
      <input type="text" id="edit-q" placeholder="英語の問題" style="width:100%;padding:6px;margin-bottom:6px;box-sizing:border-box;">
      <input type="text" id="edit-a" placeholder="日本語の答え" style="width:100%;padding:6px;margin-bottom:6px;box-sizing:border-box;">
      <input type="text" id="edit-t" placeholder="タグ" style="width:100%;padding:6px;margin-bottom:6px;box-sizing:border-box;">
      <input type="text" id="edit-note" placeholder="備考・解説" style="width:100%;padding:6px;margin-bottom:6px;box-sizing:border-box;">
      <div style="display:flex;gap:6px;">
        <button id="save-edit-btn" style="flex:1;padding:6px;cursor:pointer;background:#4CAF50;color:white;border:none;border-radius:4px;">保存</button>
        <button id="cancel-edit-btn" style="flex:1;padding:6px;cursor:pointer;background:#aaa;color:white;border:none;border-radius:4px;">キャンセル</button>
      </div>
    </div>

    <div id="review-buttons" style="display:none;margin-bottom:15px;flex-wrap:wrap;justify-content:center;gap:4px;">
      <button class="rev-btn" data-days="1" style="padding:6px 10px;cursor:pointer;background:#ffcccc;border:none;border-radius:4px;">1日後</button>
      <button class="rev-btn" data-days="3" style="padding:6px 10px;cursor:pointer;background:#ffe5cc;border:none;border-radius:4px;">3日後</button>
      <button class="rev-btn" data-days="7" style="padding:6px 10px;cursor:pointer;background:#e5ffcc;border:none;border-radius:4px;">1週間後</button>
      <button class="rev-btn" data-days="30" style="padding:6px 10px;cursor:pointer;background:#ccf2ff;border:none;border-radius:4px;">1ヶ月後</button>
      <button id="master-btn" style="padding:6px 10px;cursor:pointer;background:#4CAF50;color:white;border:none;border-radius:4px;font-weight:bold;">✨ 習得完了</button>
    </div>

    <div id="mastered-action-container" style="display:none;margin-bottom:15px;">
      <button id="unmaster-btn" style="padding:6px 12px;cursor:pointer;background:#f0ad4e;color:white;border:none;border-radius:4px;font-weight:bold;">🔄 もう一度学ぶ（未習得に戻す）</button>
    </div>

    <div id="card-action-bar" style="margin-bottom:12px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;">
      <button id="toggle-btn" style="padding:8px 14px;cursor:pointer;">答えを見る</button>
      <button id="speak-btn" style="padding:8px 10px;cursor:pointer;background:#337ab7;color:white;border:none;border-radius:4px;font-size:12px;">🔊 聴く</button>
      <button id="edit-btn" style="padding:8px 10px;cursor:pointer;background:#f0ad4e;color:white;border:none;border-radius:4px;font-size:12px;">編集</button>
      <button id="delete-btn" style="padding:8px 10px;cursor:pointer;background:#d9534f;color:white;border:none;border-radius:4px;font-size:12px;">削除</button>
    </div>

    <button id="next-btn" style="padding:8px 16px;cursor:pointer;display:none;width:100%;">次のカードへ</button>
    <div id="card-counter" style="font-size:11px;color:#888;text-align:right;margin-top:12px;">1 / 4</div>
  </div>

  <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">

  <div style="text-align:left;">
    <h3 style="font-size:14px;margin:0 0 8px 0;">新しいカードを追加</h3>
    <input type="text" id="new-q" placeholder="英語の問題" style="width:100%;padding:6px;margin-bottom:8px;box-sizing:border-box;">
    <input type="text" id="new-a" placeholder="日本語の答え" style="width:100%;padding:6px;margin-bottom:8px;box-sizing:border-box;">
    <input type="text" id="new-t" placeholder="タグ（例: 朝の会話, 日常会話）" style="width:100%;padding:6px;margin-bottom:8px;box-sizing:border-box;">
    <input type="text" id="new-note" placeholder="備考・解説（任意）" style="width:100%;padding:6px;margin-bottom:8px;box-sizing:border-box;">
    <button id="add-btn" style="padding:6px 12px;cursor:pointer;background:#4CAF50;color:white;border:none;border-radius:4px;width:100%;">カードを追加する</button>
  </div>

  <hr style="margin:20px 0;border:none;border-top:1px solid #eee;">

  <div style="text-align:left;">
    <h3 style="font-size:14px;margin:0 0 8px 0;">データ管理（バックアップ）</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <button id="export-btn" style="flex:1;min-width:110px;padding:6px;cursor:pointer;background:#6c757d;color:white;border:none;border-radius:4px;font-size:11px;">📤 JSONエクスポート</button>
      <label style="flex:1;min-width:110px;padding:6px;cursor:pointer;background:#6c757d;color:white;border:none;border-radius:4px;font-size:11px;text-align:center;display:block;">📥 JSONインポート<input type="file" id="import-file" accept=".json" style="display:none;"></label>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/filter.js"></script>
<script src="js/ui.js"></script>
<script src="js/io.js"></script>
<script src="js/app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registered!', reg))
        .catch(err => console.log('Service Worker registration failed:', err));
    });
  }
</script>

</body>
</html>
